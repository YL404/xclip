<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    xclip 应用图标母版。1024×1024，macOS 图标容器圆角 r=224（约 21.9%）。
    图形是两张错位堆叠的卡片，右上角斜切——clip 手势，也是「库里堆叠的贴文」。
    偏移量 (119,-119) 让两张卡的斜切边保持平行，堆叠关系干净。
    改尺寸只改 width/height，viewBox 不变；颜色集中在下面三个 fill。
    改图形时同步更新 resources/icon.png。
  -->
  <defs>
    <clipPath id="containerClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- 容器：墨黑 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#15171F"/>

  <g clip-path="url(#containerClip)">
    <!-- 后卡：accent 蓝，向右上偏移 119，只露出右上角一块，形成堆叠感 -->
    <path fill="#0A84FF" d="
      M 364 267
      L 731 267
      L 835 371
      L 835 584
      A 55 55 0 0 1 780 639
      L 364 639
      A 55 55 0 0 1 309 584
      L 309 322
      A 55 55 0 0 1 364 267
      Z"/>

    <!-- 前卡：暖白 -->
    <path fill="#F4F1EA" d="
      M 245 386
      L 612 386
      L 716 490
      L 716 703
      A 55 55 0 0 1 661 758
      L 245 758
      A 55 55 0 0 1 190 703
      L 190 441
      A 55 55 0 0 1 245 386
      Z"/>
  </g>
</svg>
